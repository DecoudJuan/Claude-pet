<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- La ventana sólo carga archivos locales y no habla con la red. La política
     lo deja escrito: sin connect-src no hay fetch ni WebSocket posible, ni
     siquiera por un bug o por un avatar de terceros. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<title>claude-pet</title>
<style>
  :root {
    --bg:     #ffffff;
    --ink:    #14181d;
    --muted:  #6b7682;
    --line:   #dfe4ea;
    --accent: #d97a14;
    --mono: "Cascadia Code", "Consolas", ui-monospace, monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;

    /* El avatar es cuadrado: --avatar es a la vez su ancho y su alto, y todo
       lo demás se ancla a eso. Lo fija el tamaño elegido, no el de la ventana:
       el ancho de la ventana es constante para que el panel nunca cambie. */
    --avatar: 182px;

    /* El panel mide siempre lo mismo, en los tres tamaños: el de medio con
       algo de aire. Ni apretado en chico ni desparramado en grande. */
    --panel-w: 228px;
    --panel-h: 254px;
  }
  :root[data-size="s"] { --avatar: 152px; }
  :root[data-size="l"] { --avatar: 224px; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
    font-family: var(--sans);
  }

  #stage {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
  }

  /* ---------- globo de diálogo ---------- */

  /* La piel del globo. La comparten el globo de diálogo y el saludo: son dos
     cosas distintas —uno cuenta qué pasa en Claude Code, el otro sólo saluda—
     pero las dos son la mascota hablando, y eso se dibuja de una sola forma. */
  #bubble, #greet {
    position: absolute;
    /* se ajusta al texto en vez de medir siempre lo mismo que el panel: con un
       aviso corto quedaba medio globo vacío */
    left: 0;
    right: 0;
    margin-inline: auto;
    width: fit-content;
    max-width: var(--panel-w);
    background: var(--bg);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(10, 14, 20, .28);
    transform-origin: 50% 100%;
    pointer-events: none;
  }

  #bubble {
    min-width: 136px;
    bottom: calc(var(--avatar) + 10px);
    padding: 9px 11px 10px;
    font-size: 12.5px;
    line-height: 1.35;
    opacity: 0;
    transform: translateY(6px) scale(.94);
    transition: opacity .18s ease, transform .18s cubic-bezier(.34, 1.4, .5, 1);
  }
  #bubble.show { opacity: 1; transform: none; pointer-events: auto; }

  /* Esperando input el turno está frenado, así que el globo insiste: un
     cabeceo cada tantos segundos, lo justo para que se note de reojo. */
  @keyframes bubble-insist {
    0%, 76%, 100% { transform: none; }
    84%           { transform: translateY(-5px); }
    92%           { transform: translateY(-1px); }
  }
  #bubble.show.insist { animation: bubble-insist 3.4s ease-in-out infinite; }

  /* la colita, en dos triángulos para que conserve el borde negro */
  #bubble::before, #bubble::after,
  #greet::before, #greet::after {
    content: "";
    position: absolute;
    left: calc(50% - 28px);
    width: 0;
    height: 0;
    border-style: solid;
  }
  #bubble::before, #greet::before {
    bottom: -18px;
    border-width: 18px 14px 0 0;
    border-color: var(--ink) transparent transparent transparent;
  }
  #bubble::after, #greet::after {
    bottom: -13px;
    border-width: 14px 10px 0 0;
    border-color: var(--bg) transparent transparent transparent;
  }
  /* «Hi!» es angosto: con el desplazamiento del globo grande la colita le
     quedaría colgando del borde. Centrada. */
  #greet::before, #greet::after { left: calc(50% - 7px); }

  #bubble .title { font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
  #bubble .meta {
    margin-top: 3px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #bubble .meta b { color: var(--accent); font-weight: 500; }

  /* ---------- el saludo ---------- */

  /* «Hi!» al entrar y «Bye!» antes de irse. Es el mismo globo — la mascota
     hablando —, con la letra más grande porque no tiene nada más que decir, y
     entrando de abajo hacia arriba: el mismo impulso con el que asoma sobre la
     barra de tareas. Es un globo aparte y no el de siempre porque tiene su
     propia vida: entra, se queda dos segundos y se va, sin depender de que
     cambie ningún estado. */
  #greet {
    /* En el mismo lugar que el globo: dónde termina el dibujo es cosa del
       avatar —un sombrero o unas orejas llegan casi al borde del cuadro—, así
       que el saludo se cuelga del punto que ya está reservado para hablar. */
    bottom: calc(var(--avatar) + 10px);
    z-index: 3;
    padding: 7px 14px 8px;
    font: 700 16px/1.1 var(--sans);
    letter-spacing: -.01em;
    opacity: 0;
  }
  /* Un solo ciclo para los dos segundos enteros: entra subiendo, se queda
     quieto, y se va siguiendo para arriba en vez de apagarse en el lugar. Sin
     rebote: sube y frena, como el avatar. */
  @keyframes greet-rise {
    0%        { opacity: 0; transform: translateY(20px) scale(.92); }
    22%, 78%  { opacity: 1; transform: translateY(0) scale(1); }
    100%      { opacity: 0; transform: translateY(-16px) scale(.97); }
  }
  #greet.show { animation: greet-rise 2s cubic-bezier(.22, .68, .3, 1) both; }

  /* Sin movimiento el saludo sigue siendo el saludo: aparece y se va. */
  @media (prefers-reduced-motion: reduce) {
    @keyframes greet-rise {
      0%, 100% { opacity: 0; }
      12%, 82% { opacity: 1; }
    }
  }

  /* ---------- el avatar ---------- */

  #mascot {
    width: var(--avatar);
    filter: drop-shadow(0 5px 10px rgba(8, 12, 18, .4));
    cursor: grab;
    /* La caja del avatar es cuadrada pero el dibujo no la llena: sin esto, el
       mouse "toca" al avatar pasando por las esquinas vacías. Apagado el
       rectángulo, sólo los trazos pintados del SVG atajan el puntero — y el
       evento igual burbujea hasta acá para el hover y el arrastre. */
    pointer-events: none;
  }
  #mascot svg { pointer-events: none; }
  #mascot svg path,
  #mascot svg ellipse,
  #mascot svg circle,
  #mascot svg rect { pointer-events: visiblePainted; }
  #stage.dragging #mascot { cursor: grabbing; }

  /* ---------- controles del hover ---------- */

  /* Apilados al costado de la cabeza. Posición única: si se movieran al abrir
     el panel, el botón se escapa de abajo del cursor y el segundo click no
     cierra nada. */
  #chrome {
    position: absolute;
    left: 8px;
    bottom: 8px;      /* fijo: anclado al tamaño del avatar se movían al cambiarlo */
    z-index: 4;
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0;
    transform: translateX(3px);
    transition: opacity .14s ease, transform .14s ease;
    pointer-events: none;
  }
  /* pegado al borde izquierdo de la pantalla no hay lugar: saltan al otro lado */
  #stage.side-right #chrome {
    left: auto;
    right: 8px;
    transform: translateX(-3px);
  }
  #stage.hot #chrome,
  #chrome:focus-within,
  #stage.open #chrome {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }

  #chrome button {
    width: 22px;
    height: 22px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(8, 12, 18, .3);
  }
  /* los puntos y la cruz van en SVG: el glifo ⋯ se apoya en la línea de base
     y queda descentrado dentro del círculo */
  #chrome button svg { display: block; }
  #chrome button:hover { background: var(--ink); color: var(--bg); }
  #chrome button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #btn-close:hover { background: #c0392b; border-color: #c0392b; color: #fff; }

  /* ---------- panel de ajustes ---------- */

  /* Abre ARRIBA del avatar, no encima: si lo tapara, se comería los botones
     del costado. Alto y ancho fijos, iguales en los tres tamaños — todo entra
     sin scroll, que en una ventana angosta parte el layout. */
  #panel {
    position: absolute;
    width: var(--panel-w);
    left: 50%;
    margin-left: calc(var(--panel-w) / -2);
    bottom: calc(var(--avatar) + 14px);
    height: var(--panel-h);
    background: var(--bg);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 16px 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    box-shadow: 0 8px 22px rgba(8, 12, 18, .36);
    z-index: 3;
  }
  /* `display: flex` le gana al [hidden] del navegador, así que hay que
     apagarlo a mano o el panel no se oculta nunca. */
  #panel[hidden] { display: none; }

  /* La caja es una y el alto es fijo: la página que esté arriba se la queda
     entera. */
  #panel .page {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }
  #panel .page[hidden] { display: none; }

  /* La lista arranca arriba y no se centra: con una sola sesión, centrada
     parece un cartel perdido en el medio de la nada; con el título arriba, es
     una lista corta. (Va con los dos ids: `#panel .page` pesa más que un id
     solo y si no, gana el centrado de arriba.) */
  #panel #page-sessions { justify-content: flex-start; gap: 10px; }

  .ttl {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #ses-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
    /* Con muchas sesiones la lista scrollea en vez de estirar la caja: el alto
       de la ventana se calcula con el panel y no puede depender de cuántas
       terminales tengas abiertas. */
    min-height: 0;
  }

  .ses {
    display: flex;
    align-items: baseline;
    gap: 7px;
    font: 500 11px/1.35 var(--sans);
    color: var(--ink);
  }
  .ses .dot {
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    align-self: center;
  }
  .ses .who {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ses .what {
    flex: none;
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* El punto dice el estado sin leer: lleno el que avanza, hueco el que no. */
  .ses.is-working .dot { background: var(--ink); border-color: var(--ink); }
  .ses.is-waiting .dot { background: var(--accent); border-color: var(--accent); }
  .ses.is-waiting .what { color: var(--accent); }
  .ses.is-empty { color: var(--muted); }
  .fld > span {
    display: block;
    margin-bottom: 4px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .fld .row { display: flex; gap: 4px; }
  .fld .row button {
    flex: 1 1 0;
    min-width: 0;
    padding: 4px 2px;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    font: 500 10.5px/1.2 var(--sans);
    cursor: pointer;
  }
  .fld .row button:hover { border-color: var(--ink); }
  .fld .row button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  .fld select {
    width: 100%;
    padding: 4px 6px;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    font: 500 11px/1.3 var(--sans);
    cursor: pointer;
  }
  .fld select:hover { border-color: var(--ink); }
  .fld :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    #bubble, #chrome { transition: opacity .14s ease; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="bubble" role="status" aria-live="polite">
    <div class="title"></div>
    <div class="meta"></div>
  </div>

  <div id="greet" role="status" aria-live="polite"></div>

  <div id="panel" hidden>
    <!-- Dos páginas en la misma caja. Son cosas distintas —una es lo que
         elegís, la otra es lo que está pasando— pero comparten el hueco: la
         caja tiene alto fijo porque el alto de la ventana se calcula con ella,
         y dos paneles sueltos serían dos altos que mantener. -->
    <div class="page" id="page-sessions" hidden>
      <span class="ttl">Sesiones</span>
      <ul id="ses-list"></ul>
    </div>

    <div class="page" id="page-settings">
      <div class="fld">
        <span>Tamaño</span>
        <div class="row" id="row-size"></div>
      </div>
      <label class="fld">
        <span>Avatar</span>
        <select id="sel-avatar"></select>
      </label>
      <label class="fld" id="fld-palette">
        <span>Paleta</span>
        <select id="sel-palette"></select>
      </label>
      <label class="fld">
        <span>Notebook</span>
        <select id="sel-device"></select>
      </label>
    </div>
  </div>

  <div id="chrome">
    <button id="btn-ses" type="button" title="Sesiones" aria-label="Sesiones" aria-expanded="false">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
        <circle cx="3.4" cy="4" r="1.3"/><rect x="6.4" y="3.2" width="7" height="1.6" rx=".8"/>
        <circle cx="3.4" cy="8" r="1.3"/><rect x="6.4" y="7.2" width="7" height="1.6" rx=".8"/>
        <circle cx="3.4" cy="12" r="1.3"/><rect x="6.4" y="11.2" width="7" height="1.6" rx=".8"/>
      </svg>
    </button>
    <button id="btn-menu" type="button" title="Ajustes" aria-label="Ajustes" aria-expanded="false">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
        <circle cx="3.2" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="12.8" cy="8" r="1.5"/>
      </svg>
    </button>
    <button id="btn-close" type="button" title="Cerrar" aria-label="Cerrar">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
        <path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
  </div>

  <div id="mascot"></div>
</div>

<!-- core: el contrato compartido -->
<script src="../core/body.js"></script>
<script src="../core/avatars.js"></script>
<script src="../core/devices.js"></script>
<script src="../core/greeting.js"></script>
<!-- catálogo: personajes y máquinas -->
<script src="../avatars/penguin/draw.js"></script>
<script src="../avatars/penguin/avatar.js"></script>
<script src="../avatars/otter/draw.js"></script>
<script src="../avatars/otter/avatar.js"></script>
<script src="../avatars/bear/draw.js"></script>
<script src="../avatars/bear/avatar.js"></script>
<script src="../devices/laptops.js"></script>
<!-- la ventana -->
<script src="window.js"></script>
</body>
</html>
